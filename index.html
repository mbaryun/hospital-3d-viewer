 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hospital Room 3D Viewer</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🏥 Hospital Room 3D Viewer</span>
    <a href="about.html" class="btn btn-outline-light btn-sm">About</a>
  </nav>

  <!-- MAIN LAYOUT -->
  <div class="container-fluid mt-3">
    <div class="row">

      <!-- LEFT: Control Panel -->
      <div class="col-md-2 control-panel" style="min-width:170px;">
        <h6 class="text-white">📷 Camera Views</h6>
        <button class="btn btn-primary w-100 mb-2" onclick="setCameraFront()">Front View</button>
        <button class="btn btn-primary w-100 mb-2" onclick="setCameraSide()">Side View</button>
        <button class="btn btn-primary w-100 mb-2" onclick="setCameraTop()">Top View</button>

        <hr class="border-secondary"/>

        <h6 class="text-white">💡 Lighting</h6>
        <button class="btn btn-warning w-100 mb-2" onclick="toggleLight()">Toggle Main Light</button>
        <button class="btn btn-warning w-100 mb-2" onclick="toggleSpotlight()">Toggle Spotlight</button>

        <hr class="border-secondary"/>

        <h6 class="text-white">🎨 Model Options</h6>
        <button class="btn btn-success w-100 mb-2" onclick="toggleWireframe()">Wireframe On/Off</button>
        <button class="btn btn-success w-100 mb-2" onclick="resetScene()">Reset Scene</button>

        <hr class="border-secondary"/>

        <h6 class="text-white">🎬 Animation</h6>
        <button class="btn btn-info w-100 mb-2" onclick="toggleAnimation()">Play/Pause Spin</button>
      </div>

      <!-- MIDDLE: 3D Canvas -->
      <div class="col-md-7 p-0">
        <canvas id="three-canvas"></canvas>
      </div>

      <!-- RIGHT: Model Info Panel -->
      <div class="col-md-3 info-panel" style="min-width:220px;">
        <h5 class="text-white">📋 Load Models</h5>
        <button class="btn btn-outline-light w-100 mb-2" onclick="loadModel('bed')">🛏️ Load Bed</button>
        <button class="btn btn-outline-light w-100 mb-2" onclick="loadModel('monitor')">🖥️ Load Monitor</button>
        <button class="btn btn-outline-light w-100 mb-2" onclick="loadModel('iv_stand')">🩺 Load IV Stand</button>
        <button class="btn btn-outline-light w-100 mb-2" onclick="loadModel('chair')">🪑 Load Chair</button>
        <button class="btn btn-outline-light w-100 mb-2" onclick="loadModel('cabinet')">🗄️ Load Cabinet</button>
        <button class="btn btn-danger w-100 mb-2 mt-2" onclick="clearModels()">🗑️ Clear All</button>

        <hr class="border-secondary"/>

        <h6 class="text-white">ℹ️ Object Info</h6>
        <div id="model-info" class="info-box">
          Click a model button to load it and see its description here.
        </div>
      </div>

    </div>
  </div>

  <!-- Three.js via CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  </script>

  <!-- App Script -->
  <script type="module" src="js/app.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
